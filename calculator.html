<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e7f0e9">
  <title>Kalkulator</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172622;
      --muted: #83918b;
      --paper: #f7f8f3;
      --canvas: #e7f0e9;
      --line: #dce5dd;
      --accent: #e4744f;
      --accent-hover: #d9613b;
      --sage: #dce9df;
      --sage-hover: #cedfd2;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background-color: var(--canvas);
      background-image: radial-gradient(#b6c9bb 0.8px, transparent 0.8px);
      background-size: 19px 19px;
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    .calculator {
      width: min(100%, 360px);
      padding: 24px;
      border: 1px solid rgba(23, 38, 34, 0.08);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 22px 55px rgba(35, 61, 48, 0.16), 0 3px 8px rgba(35, 61, 48, 0.07);
      animation: appear 420ms ease-out both;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #77a587;
      content: "";
    }

    .screen {
      min-height: 116px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      gap: 8px;
      overflow: hidden;
      padding: 16px 4px 20px;
      border-bottom: 1px solid var(--line);
      text-align: right;
    }

    .previous {
      width: 100%;
      min-height: 18px;
      overflow: hidden;
      color: var(--muted);
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .current {
      width: 100%;
      overflow: hidden;
      font-size: clamp(34px, 11vw, 48px);
      font-weight: 700;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      padding-top: 18px;
    }

    button {
      min-width: 0;
      aspect-ratio: 1.18;
      border: 0;
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 19px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: #edf2ed; }
    button:active { transform: scale(0.95); }
    button:focus-visible { outline: 3px solid #82a98d; outline-offset: 2px; }

    button.utility {
      background: var(--sage);
      color: #355244;
      font-size: 16px;
    }

    button.utility:hover { background: var(--sage-hover); }

    button.operator {
      background: #f6e7df;
      color: #a64f32;
    }

    button.operator:hover { background: #f0d8cb; }

    button.equals {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 10px rgba(228, 116, 79, 0.22);
    }

    button.equals:hover { background: var(--accent-hover); }
    button.zero { grid-column: span 2; aspect-ratio: auto; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Kalkulator UKDW">
    <header class="topline">
      <h1>Kalkulator UKDW</h1>
      <span class="status">Ready</span>
    </header>

    <section class="screen" aria-live="polite" aria-atomic="true">
      <div class="previous" id="previous"></div>
      <output class="current" id="display" aria-label="Result">0</output>
    </section>

    <div class="keys" aria-label="Tombol kalkulator">
      <button class="utility" type="button" data-action="clear" aria-label="Hapus semua">AC</button>
      <button class="utility" type="button" data-action="sign" aria-label="Ubah tanda">+/−</button>
      <button class="utility" type="button" data-action="percent" aria-label="Persen">%</button>
      <button class="operator" type="button" data-operator="÷" aria-label="Bagi">÷</button>

      <button type="button" data-digit="7">7</button>
      <button type="button" data-digit="8">8</button>
      <button type="button" data-digit="9">9</button>
      <button class="operator" type="button" data-operator="×" aria-label="Kali">×</button>

      <button type="button" data-digit="4">4</button>
      <button type="button" data-digit="5">5</button>
      <button type="button" data-digit="6">6</button>
      <button class="operator" type="button" data-operator="−" aria-label="Kurang">−</button>

      <button type="button" data-digit="1">1</button>
      <button type="button" data-digit="2">2</button>
      <button type="button" data-digit="3">3</button>
      <button class="operator" type="button" data-operator="+" aria-label="Tambah">+</button>

      <button class="zero" type="button" data-digit="0">0</button>
      <button type="button" data-action="decimal" aria-label="Koma desimal">.</button>
      <button class="equals" type="button" data-action="equals" aria-label="Hitung">=</button>
    </div>
  </main>

  <script>
    const display = document.querySelector("#display");
    const previous = document.querySelector("#previous");
    const status = document.querySelector(".status");

    let currentValue = "0";
    let storedValue = null;
    let pendingOperator = null;
    let replaceCurrent = false;
    let finishedCalculation = false;

    function render() {
      display.textContent = currentValue;
      previous.textContent = storedValue !== null && pendingOperator
        ? `${formatNumber(storedValue)} ${pendingOperator}`
        : "";
    }

    function formatNumber(value) {
      return Number(value).toLocaleString("id-ID", { maximumFractionDigits: 10 });
    }

    function enterDigit(digit) {
      if (replaceCurrent || finishedCalculation || currentValue === "0" || currentValue === "Error") {
        currentValue = digit;
        replaceCurrent = false;
        finishedCalculation = false;
      } else if (currentValue.replace("-", "").length < 14) {
        currentValue += digit;
      }
      status.textContent = "Siap";
      render();
    }

    function calculate(left, right, operator) {
      switch (operator) {
        case "+": return left + right;
        case "−": return left - right;
        case "×": return left * right;
        case "÷": return right === 0 ? NaN : left / right;
        default: return right;
      }
    }

    function cleanResult(value) {
      if (!Number.isFinite(value)) return null;
      return String(Number(value.toPrecision(11)));
    }

    function chooseOperator(operator) {
      const value = Number(currentValue);
      if (!Number.isFinite(value)) return;

      if (pendingOperator && !replaceCurrent) {
        const result = cleanResult(calculate(Number(storedValue), value, pendingOperator));
        if (result === null) {
          showError();
          return;
        }
        currentValue = result;
      }

      storedValue = currentValue;
      pendingOperator = operator;
      replaceCurrent = true;
      finishedCalculation = false;
      status.textContent = "Siap";
      render();
    }

    function showError() {
      currentValue = "Error";
      storedValue = null;
      pendingOperator = null;
      replaceCurrent = true;
      finishedCalculation = false;
      status.textContent = "Tidak bisa";
      render();
    }

    function equals() {
      if (pendingOperator === null || storedValue === null) return;
      const result = cleanResult(calculate(Number(storedValue), Number(currentValue), pendingOperator));
      if (result === null) {
        showError();
        return;
      }
      previous.textContent = `${formatNumber(storedValue)} ${pendingOperator} ${formatNumber(currentValue)} =`;
      currentValue = result;
      storedValue = null;
      pendingOperator = null;
      replaceCurrent = true;
      finishedCalculation = true;
      status.textContent = "Selesai";
      display.textContent = currentValue;
    }

    function clearAll() {
      currentValue = "0";
      storedValue = null;
      pendingOperator = null;
      replaceCurrent = false;
      finishedCalculation = false;
      status.textContent = "Siap";
      render();
    }

    function performAction(action) {
      if (action === "clear") clearAll();
      if (action === "equals") equals();
      if (action === "decimal") {
        if (replaceCurrent || finishedCalculation || currentValue === "Error") {
          currentValue = "0.";
          replaceCurrent = false;
          finishedCalculation = false;
        } else if (!currentValue.includes(".")) {
          currentValue += ".";
        }
        status.textContent = "Siap";
        render();
      }
      if (action === "sign" && currentValue !== "0" && currentValue !== "Error") {
        currentValue = currentValue.startsWith("-") ? currentValue.slice(1) : `-${currentValue}`;
        render();
      }
      if (action === "percent" && currentValue !== "Error") {
        currentValue = cleanResult(Number(currentValue) / 100) ?? "0";
        replaceCurrent = true;
        render();
      }
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
      if (button.dataset.operator) chooseOperator(button.dataset.operator);
      if (button.dataset.action) performAction(button.dataset.action);
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) enterDigit(event.key);
      else if (event.key === "." || event.key === ",") performAction("decimal");
      else if (event.key === "+") chooseOperator("+");
      else if (event.key === "-") chooseOperator("−");
      else if (event.key === "*") chooseOperator("×");
      else if (event.key === "/") { event.preventDefault(); chooseOperator("÷"); }
      else if (event.key === "Enter" || event.key === "=") { event.preventDefault(); equals(); }
      else if (event.key === "Escape") clearAll();
      else if (event.key === "Backspace") {
        if (!replaceCurrent && currentValue !== "Error") {
          currentValue = currentValue.length > 1 ? currentValue.slice(0, -1) : "0";
          if (currentValue === "-") currentValue = "0";
          render();
        }
      }
    });
  </script>
</body>
</html>
